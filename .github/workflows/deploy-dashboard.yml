name: 📡 Deploy Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Cloudflare CLI
        run: |
          npm install -g @cloudflare/wrangler@latest
          wrangler --version

      - name: 📤 Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd dashboard
          
          # Deploy to Cloudflare Pages
          wrangler pages deploy . \
            --project-name jovi-academy-dashboard \
            --branch main

      - name: 🌐 Configure custom domain
        if: success()
        run: |
          echo "✅ Dashboard deployed successfully!"
          echo "🌐 Access at: https://jovi-dashboard.angaflow.com"
          echo ""
          echo "📝 To set custom domain:"
          echo "   1. Go to Cloudflare Dashboard"
          echo "   2. Workers & Pages → jovi-academy-dashboard"
          echo "   3. Custom domains → Add jovi-dashboard.angaflow.com"

      - name: ✅ Verify deployment
        run: |
          sleep 2
          
          # Check if dashboard is accessible
          if curl -f -m 10 "https://jovi-academy-dashboard.pages.dev" > /dev/null 2>&1; then
            echo "✅ Dashboard is live!"
          else
            echo "⚠️ Dashboard endpoint not responding yet (may take a moment)"
          fi

      - name: 💬 Slack notification (optional)
        if: always()
        run: |
          echo "Dashboard deployment status:"
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ SUCCESS - Dashboard deployed"
          else
            echo "❌ FAILED - Check logs"
          fi
