name: 🏥 Health Check

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔍 Check M1 Worker health
        run: |
          echo "🖥️ Checking Máquina 1 (Video Upload Worker)..."
          
          # Check if Worker endpoint is responding
          # Replace with actual Worker URL
          WORKER_URL="https://jovi-academy.example.com/health"
          
          if curl -f -m 10 "$WORKER_URL" > /dev/null 2>&1; then
            echo "✅ M1 Worker is healthy"
          else
            echo "⚠️ M1 Worker health check failed (may be expected if URL not set up)"
          fi

      - name: 🔍 Check M2 scripts generation
        run: |
          echo "🖥️ Checking Máquina 2 (Script Generator)..."
          
          # Check if scripts are being generated
          if [ -f "scripts/generated/index.json" ]; then
            SCRIPT_COUNT=$(cat scripts/generated/index.json | jq '.success' 2>/dev/null || echo "0")
            GENERATED_AT=$(cat scripts/generated/index.json | jq '.generated_at' 2>/dev/null || echo "unknown")
            
            echo "✅ M2 generating scripts"
            echo "   Scripts generated: $SCRIPT_COUNT"
            echo "   Last generated: $GENERATED_AT"
          else
            echo "⚠️ No scripts generated yet (expected on first run)"
          fi

      - name: 📚 Verify curriculum files
        run: |
          echo "📚 Checking curriculum files..."
          
          for q in q1 q2 q3 q4; do
            if [ -f "curriculum/2026-${q}.json" ]; then
              EPISODE_COUNT=$(cat curriculum/2026-${q}.json | jq '.episodes | length')
              echo "✅ Q${q^^} loaded: $EPISODE_COUNT weeks"
            else
              echo "❌ Q${q^^} curriculum missing"
            fi
          done

      - name: 📊 Generate status report
        run: |
          echo "## 📊 System Health Report" > /tmp/health-report.md
          echo "" >> /tmp/health-report.md
          echo "**Generated**: $(date -u)" >> /tmp/health-report.md
          echo "" >> /tmp/health-report.md
          
          # M2 stats
          if [ -f "scripts/generated/index.json" ]; then
            echo "### 🖥️ Máquina 2 (Script Generator)" >> /tmp/health-report.md
            cat scripts/generated/index.json | jq -r '"- Success: \(.success)/\(.total)"' >> /tmp/health-report.md
            cat scripts/generated/index.json | jq -r '"- Failed: \(.failed)"' >> /tmp/health-report.md
          fi
          
          # Curriculum stats
          echo "" >> /tmp/health-report.md
          echo "### 📚 Curriculum" >> /tmp/health-report.md
          for q in q1 q2 q3 q4; do
            if [ -f "curriculum/2026-${q}.json" ]; then
              WEEKS=$(cat curriculum/2026-${q}.json | jq '.episodes | length')
              echo "- 2026-Q${q^^}: $WEEKS weeks" >> /tmp/health-report.md
            fi
          done
          
          cat /tmp/health-report.md

      - name: 💬 Slack notification (optional)
        if: always()
        run: |
          echo "💬 Slack notification would go here"
          echo "   (Configure SLACK_WEBHOOK secret in GitHub)"
